[install]
saveTextLockfile = true
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any. The Lovable packages that used to be excluded here are gone
# (see vite.config.ts), and NOTHING should be excluded lightly: this guard is part
# of what keeps a freshly-published malicious version out of a build that signs
# USDC payments.
minimumReleaseAgeExcludes = []
